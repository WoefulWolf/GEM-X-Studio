[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "gem-studio"
version = "0.1.0"
description = "GEM-X Studio: desktop/web UI for GEM-X Body Pose, Hand Pose and Body Motion"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "huggingface_hub>=0.30",
    "imageio-ffmpeg>=0.5",
]

[project.optional-dependencies]
# Native window backed by the operating system's own webview (WebView2 on Windows).
native = ["pywebview>=5.3"]

[project.scripts]
gem-studio = "gem_studio.__main__:main"

[tool.setuptools.packages.find]
include = ["gem_studio", "gem_studio.*"]

[tool.setuptools.package-data]
gem_studio = ["static/**/*", "icon.ico", "icon.png"]
